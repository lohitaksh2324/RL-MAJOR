services:
  - type: web
    name: rl-disaster-evacuation
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run src/visualization/streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
    plan: free
